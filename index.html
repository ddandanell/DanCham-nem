<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DanCham Member Survey 2024</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #f5f7fb;
      --card-bg: #ffffff;
      --text: #111111;
      --btn-red: #c8102e;
      --border: #dddddd;
      --border-soft: #e4e8f0;
      --muted: #666666;
      --progress-bg: #e3e7f0;
      --progress-fill: #c8102e;
      --input-bg: #ffffff;
      --input-border: #ced4e0;
      --input-radius: 8px;
      --shadow-soft: 0 10px 30px rgba(15, 23, 42, 0.08);
      --content-max-width: 820px;
      --section-gap: 28px;
      --focus-ring: 0 0 0 3px rgba(200, 16, 46, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      font-size: 17px;
      line-height: 1.7;
      background: radial-gradient(circle at top, #ffffff 0, #f5f7fb 55%, #edf0f8 100%);
      color: var(--text);
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
      backdrop-filter: blur(8px);
      background: rgba(255, 255, 255, 0.9);
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 2px 16px rgba(15, 23, 42, 0.08);
      max-width: 100%;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 1;
    }

    .logo-img {
      display: block;
      height: 52px;
      width: auto;
      filter: drop-shadow(0 4px 12px rgba(200, 16, 46, 0.3));
    }

    .lang-toggle {
      display: inline-flex;
      border: 1px solid var(--border-soft);
      border-radius: 999px;
      overflow: hidden;
      font-size: 13px;
      background: #f1f5f9;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    }

    .lang-toggle button {
      border: none;
      background: transparent;
      padding: 6px 13px;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.2s ease;
    }

    .lang-toggle button:hover {
      color: #0f172a;
    }

    .lang-toggle button.active {
      background: #ffffff;
      color: var(--btn-red);
      font-weight: 600;
      box-shadow: 0 1px 3px rgba(148, 163, 184, 0.3);
    }

    .progress-shell {
      padding: 18px 24px 4px 24px;
      flex-shrink: 0;
    }

    .progress-bar-wrapper {
      width: 100%;
      max-width: var(--content-max-width);
      margin: 0 auto;
    }

    .progress-label {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .progress-label span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .progress-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #22c55e;
    }

    .progress-bar {
      height: 8px;
      width: 100%;
      border-radius: 999px;
      background: var(--progress-bg);
      overflow: hidden;
      box-shadow: inset 0 1px 3px rgba(15, 23, 42, 0.05);
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #c8102e, #f97373);
      transition: width 0.25s ease;
    }

    main {
      flex: 1;
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 32px 24px 48px;
    }

    #survey-form {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    .screen-shell {
      width: 100%;
      max-width: var(--content-max-width);
    }

    .card {
      background: var(--card-bg);
      border-radius: 22px;
      padding: 36px 44px 34px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.1);
      border: 1px solid rgba(226, 232, 240, 0.85);
      display: flex;
      flex-direction: column;
      min-height: 0;
      gap: 18px;
      transition: box-shadow 0.25s ease, transform 0.25s ease;
    }

    .card:hover {
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.15);
      transform: translateY(-3px);
    }

    .screen {
      width: 100%;
      text-align: left;
      display: none;
      animation: slideUpFadeIn 0.4s ease-out;
    }

    .screen.active {
      display: block;
    }

    @keyframes slideUpFadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .screen-header {
      margin-bottom: 18px;
      border-bottom: 1px dashed #e2e8f0;
      padding-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .screen-header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .screen-tag {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      font-weight: 600;
      padding: 3px 7px;
      border-radius: 999px;
      background: #e2e8f0;
    }

    .screen-section-title {
      font-size: 15px;
      color: #475569;
      line-height: 1.6;
    }

    .welcome-title {
      font-size: clamp(28px, 4.6vw, 36px);
      font-weight: 800;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .welcome-title .hand {
      font-size: 0.9em;
      border-radius: 999px;
      border: 2px solid var(--btn-red);
      padding: 4px 10px;
      line-height: 1;
      background: #fff1f2;
    }

    .welcome-body {
      font-size: 16px;
      line-height: 1.7;
      max-width: 100%;
      color: #475569;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .welcome-highlight {
      border-radius: 12px;
      padding: 12px 16px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      font-size: 13px;
      color: #475569;
      margin-top: 8px;
      line-height: 1.7;
    }

    .welcome-highlight strong {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #334155;
    }

    .question-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .question-meta {
      font-size: 12px;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .question-index-pill {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      font-weight: 500;
    }

    .required-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--muted);
    }

    .required-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--btn-red);
    }

    .question-title {
      font-size: clamp(20px, 3.5vw, 26px);
      font-weight: 600;
      margin-bottom: 16px;
      color: #0f172a;
      line-height: 1.5;
      letter-spacing: -0.01em;
    }

    .question-subtitle {
      font-size: 15px;
      color: #52607b;
      margin-bottom: 24px;
      max-width: 100%;
      line-height: 1.7;
    }

    .question-main {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: var(--section-gap);
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 4px;
    }

    .option-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      border-radius: 14px;
      border: 1px solid var(--border-soft);
      cursor: pointer;
      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        box-shadow 0.15s ease,
        transform 0.08s ease;
      background: #ffffff;
      line-height: 1.6;
    }

    .option-row input[type="radio"],
    .option-row input[type="checkbox"] {
      flex-shrink: 0;
    }

    .option-main {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .option-label {
      font-size: 15px;
      line-height: 1.5;
      color: #0f172a;
    }

    .option-row:hover {
      background: #f9fafb;
      border-color: #cbd5f5;
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.06);
      transform: translateY(-1px);
    }

    .option-row.selected {
      border-color: var(--btn-red);
      background: #fff1f2;
      box-shadow: 0 12px 28px rgba(200, 16, 46, 0.25);
      transform: translateY(-1px);
    }

    .rating-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .rating-labels {
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      font-size: 12px;
      color: var(--muted);
      margin-top: 12px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .rating-labels span {
      text-align: left;
    }

    .rating-scale-caption {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 8px;
      text-align: left;
    }

    .rating-button {
      min-width: 42px;
      min-height: 42px;
      padding: 8px 14px;
      border-radius: 18px;
      border: 2px solid var(--border);
      background: #ffffff;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
    }

    .rating-button:hover {
      border-color: #c8102e;
      background: #fff1f2;
      color: #c8102e;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(200, 16, 46, 0.2);
    }

    .rating-button.selected {
      background: var(--btn-red);
      border-color: var(--btn-red);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(200, 16, 46, 0.35);
      transform: translateY(-2px);
    }

    textarea,
    input[type="text"],
    input[type="email"],
    input[type="tel"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: var(--input-radius);
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      font-size: 15px;
      line-height: 1.6;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
      color: #0f172a;
      font-family: inherit;
    }

    textarea {
      min-height: 120px;
      line-height: 1.6;
      resize: vertical;
    }

    textarea::placeholder,
    input::placeholder {
      color: #9ca3af;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="tel"]:focus,
    textarea:focus {
      outline: none;
      border-color: var(--btn-red);
      box-shadow: var(--focus-ring);
    }

    .contact-grid {
      display: grid;
      gap: 20px;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .contact-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .contact-field label {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 14px;
      color: #0f172a;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .contact-field input {
      margin-top: 4px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 2px solid var(--input-border);
      background: var(--input-bg);
      font-size: 15px;
      line-height: 1.5;
      transition: all 0.2s ease;
      box-shadow: 0 2px 4px rgba(15, 23, 42, 0.04);
    }

    .contact-field input:focus {
      outline: none;
      border-color: var(--btn-red);
      box-shadow: var(--focus-ring), 0 4px 12px rgba(200, 16, 46, 0.1);
      transform: translateY(-1px);
    }

    .contact-field input:hover:not(:focus) {
      border-color: #94a3b8;
    }

    .contact-field small {
      font-size: 12px;
      color: #64748b;
      font-weight: 400;
      margin-top: -4px;
      line-height: 1.5;
    }

    .contact-disclaimer {
      border: 1px solid #e2e8f0;
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      border-radius: 14px;
      padding: 16px 18px 16px 44px;
      font-size: 13px;
      color: #475569;
      line-height: 1.7;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      position: relative;
    }

    .contact-disclaimer::before {
      content: "ℹ️";
      position: absolute;
      left: 18px;
      top: 16px;
      font-size: 16px;
      opacity: 0.7;
    }

    .contact-error {
      margin-top: 8px;
      margin-bottom: 16px;
      padding: 12px 16px;
      font-size: 13px;
      color: #ffffff;
      background: linear-gradient(135deg, #c8102e 0%, #dc2626 100%);
      border-radius: 10px;
      display: none;
      box-shadow: 0 4px 12px rgba(200, 16, 46, 0.25);
      line-height: 1.6;
      position: relative;
      padding-left: 40px;
    }

    .contact-error::before {
      content: "⚠️";
      position: absolute;
      left: 16px;
      top: 12px;
      font-size: 14px;
    }

    .contact-error.active {
      display: block;
      animation: slideDownFadeIn 0.3s ease-out;
    }

    @keyframes slideDownFadeIn {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .contact-skip-option {
      margin-top: 20px;
      margin-bottom: 12px;
      text-align: center;
      padding: 16px 0;
      border-top: 1px dashed #e2e8f0;
      border-bottom: 1px dashed #e2e8f0;
    }

    .contact-skip-option .btn {
      width: 100%;
      justify-content: center;
      background: #ffffff;
      border-color: #e2e8f0;
      color: #64748b;
      font-weight: 500;
    }

    .contact-skip-option .btn:hover:not(:disabled) {
      background: #f8fafc;
      border-color: #cbd5e1;
      color: #475569;
    }

    .small-hint {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 6px;
      line-height: 1.6;
      text-align: left;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 26px;
      gap: 12px;
      padding-top: 22px;
      border-top: 1px dashed #e2e8f0;
    }

    .nav-left,
    .nav-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      border: 1px solid transparent;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: #e5e7eb;
      color: var(--text);
      transition: all 0.2s ease;
      min-width: 90px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
    }

    .btn-primary {
      background: linear-gradient(135deg, #c8102e 0%, #e91e3a 100%);
      color: #ffffff;
      border-color: var(--btn-red);
      box-shadow: 0 6px 20px rgba(200, 16, 46, 0.4);
    }

    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #a80e27 0%, #c8102e 100%);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(200, 16, 46, 0.5);
    }

    .btn-primary:disabled {
      opacity: 0.55;
      cursor: default;
      box-shadow: none;
      transform: none;
    }

    .btn-ghost {
      background: #f9fafb;
      border-color: #e5e7eb;
      color: #374151;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
    }

    .btn-ghost:hover:not(:disabled) {
      background: #e5e7eb;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    }

    .thank-you-title {
      font-size: clamp(26px, 3.8vw, 34px);
      font-weight: 700;
      margin-bottom: 14px;
      color: #0f172a;
      line-height: 1.5;
    }

    .thank-you-body {
      font-size: 16px;
      color: #475569;
      max-width: 560px;
      line-height: 1.8;
      margin-bottom: 26px;
    }

    .thank-you-panel {
      margin-top: 6px;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      font-size: 13px;
      color: #475569;
      line-height: 1.75;
    }

    footer {
      border-top: 1px solid rgba(226, 232, 240, 0.9);
      padding: 16px 24px 22px;
      font-size: 13px;
      color: var(--muted);
      background: #ffffff;
      flex-shrink: 0;
    }

    .footer-inner {
      max-width: var(--content-max-width);
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 16px;
      align-items: center;
      justify-content: space-between;
    }

    .footer-company {
      font-weight: 600;
      color: var(--text);
    }

    .footer-address {
      white-space: nowrap;
    }

    .footer-link a {
      color: var(--btn-red);
      text-decoration: none;
    }

    .footer-link a:hover {
      text-decoration: underline;
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 900px) {
      .question-body-layout {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    @media (max-width: 780px) {
      header {
        padding: 12px 16px;
        flex-direction: column;
        gap: 12px;
        text-align: center;
      }

      .logo {
        width: 100%;
        justify-content: center;
      }

      .logo-img {
        height: 48px;
      }

      .lang-toggle {
        width: auto;
      }

      .progress-shell {
        padding: 12px 16px 0 16px;
      }

      main {
        padding: 20px 16px;
      }

      .card {
        padding: 24px 18px;
        border-radius: 18px;
        gap: 16px;
      }

      .welcome-title {
        font-size: 24px;
        justify-content: center;
        text-align: center;
        margin-bottom: 16px;
      }

      .welcome-body {
        font-size: 15px;
        gap: 10px;
      }

      .question-title {
        font-size: 20px;
        margin-bottom: 14px;
      }

      .question-subtitle {
        font-size: 14px;
        margin-bottom: 20px;
      }

      .option-label {
        font-size: 14px;
      }

      .option-row {
        padding: 14px 16px;
      }

      .footer-inner {
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 8px;
      }

      .footer-address {
        white-space: normal;
      }

      .contact-grid {
        gap: 18px;
      }

      .contact-field input {
        padding: 13px 15px;
        font-size: 16px;
      }

      .contact-disclaimer {
        padding: 14px 16px 14px 42px;
        font-size: 12px;
      }

      .contact-disclaimer::before {
        left: 16px;
        top: 14px;
        font-size: 15px;
      }

      .contact-error {
        padding: 11px 14px 11px 38px;
        font-size: 12px;
      }

      .contact-error::before {
        left: 14px;
        top: 11px;
        font-size: 13px;
      }
    }

    @media (max-width: 600px) {
      .nav {
        flex-direction: column-reverse;
        align-items: stretch;
        gap: 10px;
      }

      .nav-left,
      .nav-right {
        width: 100%;
        justify-content: center;
      }

      .btn {
        width: 100%;
        justify-content: center;
        padding: 13px 24px;
      }

      .rating-row {
        justify-content: center;
      }

      .rating-button {
        min-width: 38px;
        min-height: 38px;
        padding: 6px 12px;
        font-size: 14px;
      }

      .card {
        padding: 20px 16px;
        gap: 14px;
      }

      .question-title {
        font-size: 18px;
      }

      .welcome-title {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <img
        src="image.png"
        alt="DanCham – Danish-Indonesian Business Chamber"
        id="logo-img"
        class="logo-img"
      />
    </div>
    <div class="lang-toggle" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="da" class="active">DA</button>
    </div>
  </header>

  <div class="progress-shell">
    <div class="progress-bar-wrapper">

    progressExtraEl.textContent = s.progressExplainer;
    const width = (step / total) * 100;

      renderContactDetails();

    let showErrors = false;

    function normalize(value) {
      return value.trim();
    }

    function isValidEmail(value) {
      return /[^\s@]+@[^\s@]+\.[^\s@]+/.test(value);
    }

    function isContactValid() {
      const nameOk = normalize(nameInput.value).length > 1;
      const emailOk = isValidEmail(normalize(emailInput.value));
      const whatsappOk = normalize(whatsappInput.value).length > 3;
      return nameOk && emailOk && whatsappOk;
    }

      const valid = isContactValid();
      submitBtn.disabled = !valid || isSubmitting;
      errorEl.classList.toggle("active", showErrors && !valid);

      answers.contact_name = nameInput.value;
      answers.contact_email = emailInput.value;
      answers.contact_whatsapp = whatsappInput.value;

    if (isSubmitting) return;

    const notify = () => {
      if (typeof onStateChange === "function") {
        onStateChange();
      }
    };

    try {
      isSubmitting = true;
      notify();

      const formData = new FormData(formEl);
      const qList = getQuestions();

      qList.forEach((question) => {
        const name = question.name || question.id;
        if (!name) return;

        if (question.type === "multi-choice") {
          formData.delete(name);
          formData.delete(name + "[]");
          const arr = answers[question.id];
          if (Array.isArray(arr)) {
            arr.forEach((value) => {
              formData.append(name + "[]", value);
            });
          }
        } else if (question.type === "single-choice") {
          if (typeof answers[question.id] === "string") {
            formData.set(name, answers[question.id]);
          }
        } else if (question.type === "text") {
          if (typeof answers[question.id] === "string") {
            formData.set(name, answers[question.id]);
          }
        } else if (
          question.type === "rating-1-5" ||
          question.type === "rating-0-10"
        ) {
          if (typeof answers[question.id] === "number") {
            formData.set(name, String(answers[question.id]));
          }
        }
      });

      // Always collect contact details for system alignment
      const nameValue = typeof answers.contact_name === "string" ? answers.contact_name.trim() : "";
      const emailValue = typeof answers.contact_email === "string" ? answers.contact_email.trim() : "";
      const whatsappValue = typeof answers.contact_whatsapp === "string" ? answers.contact_whatsapp.trim() : "";

      formData.set("contact_name", nameValue);
      formData.set("contact_email", emailValue);
      formData.set("contact_whatsapp", whatsappValue);
      formData.set("response_language", currentLang);
      formData.set("submitted_at", new Date().toISOString());

      const action = (formEl.getAttribute("action") || "").trim();
      const method = (formEl.getAttribute("method") || "POST").toUpperCase();

      // Prepare backup data as JSON
      const backupData = {
        submitted_at: new Date().toISOString(),
        response_language: currentLang,
        contact_name: nameValue,
        contact_email: emailValue,
        contact_whatsapp: whatsappValue,
        answers: {}
      };

      // Collect all answers for backup (reuse qList from above)
      qList.forEach((question) => {
        const answerValue = answers[question.id];
        if (answerValue !== undefined && answerValue !== null && answerValue !== "") {
          backupData.answers[question.id] = answerValue;
        }
      });

      // Always send the survey responses via email
      if (action.length > 0) {
        try {
          await fetch(action, {
            method,
            body: formData,
            headers: {
              Accept: "application/json"
            }
          });
        } catch (err) {
          // Network hiccups should not block completion; errors are ignored intentionally.
        }
      }

      // Send backup to server (non-blocking, errors are ignored)
      if (BACKUP_ENDPOINT && BACKUP_ENDPOINT.trim().length > 0) {
        try {
          await fetch(BACKUP_ENDPOINT.trim(), {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Accept: "application/json"
            },
            body: JSON.stringify(backupData)
          });
        } catch (err) {
          // Backup failures should not block completion; errors are ignored intentionally.
          console.warn("Backup submission failed (non-critical):", err);
        }
      }

      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (e) {}
      answers = {};

      currentStepIndex = THANK_YOU_STEP_INDEX;
      render();
    } finally {
      isSubmitting = false;
      notify();
    }
  }

  function renderQuestion(q) {
    const s = getStrings();
    const screen = document.createElement("div");
    screen.className = "screen active";

    const indexDisplay = `${currentStepIndex}/${TOTAL_QUESTIONS}`;
    const metaLabel = q.required
      ? `<span class="required-badge"><span class="required-dot"></span><span>${s.required}</span></span>`
      : `<span class="helper-text">${s.optional}</span>`;

    let inner = `
      <div class="screen-header">
        <div class="screen-header-top">
          <div class="question-meta-row">
            <span class="question-index-pill">${s.questionLabel} ${indexDisplay}</span>
            <div class="question-meta">
              ${metaLabel}
            </div>
          </div>
        </div>
      </div>
      <div class="question-title">${q.title}</div>
      ${q.subtitle ? `<div class="question-subtitle">${q.subtitle}</div>` : ""}
      <div class="question-body-layout">
        <div class="question-main" id="question-body"></div>
      </div>
      <div class="nav">
        <div class="nav-left">
          <button class="btn btn-ghost" id="btn-back">${s.back}</button>
        </div>
        <div class="nav-right">
          <button class="btn btn-primary" id="btn-next">${
            currentStepIndex === TOTAL_QUESTIONS ? s.finish : s.next
          }</button>
        </div>
      </div>
    `;

    screen.innerHTML = inner;
    screenContainer.appendChild(screen);

    const bodyEl = screen.querySelector("#question-body");
    const backBtn = screen.querySelector("#btn-back");
    const nextBtn = screen.querySelector("#btn-next");

    backBtn.disabled = currentStepIndex === 0;
    backBtn.addEventListener("click", () => {
      if (isSubmitting) return;
      if (currentStepIndex > 0) {
        currentStepIndex -= 1;
      }
      render();
    });

    // Render per type
    if (q.type === "single-choice") {
      renderSingleChoice(q, bodyEl);
    } else if (q.type === "multi-choice") {
      renderMultiChoice(q, bodyEl);
    } else if (q.type === "rating-1-5" || q.type === "rating-0-10") {
      renderRating(q, bodyEl);
    } else if (q.type === "text") {
      renderText(q, bodyEl);
    }

    function isValid() {
      if (!q.required) return true;
      const value = answers[q.id];

      if (q.type === "multi-choice") {
        return Array.isArray(value) && value.length > 0;
      }
      if (q.type === "text") {
        return typeof value === "string" && value.trim().length > 0;
      }
      if (q.type === "single-choice") {
        return typeof value === "string" && value.trim().length > 0;
      }
      if (q.type === "rating-1-5" || q.type === "rating-0-10") {
        return typeof value === "number";
      }
      return true;
    }

    function updateNextBtnState() {
      nextBtn.disabled = !isValid() || isSubmitting;
    }

    screen._updateNextBtnState = updateNextBtnState;
    updateNextBtnState();

    nextBtn.addEventListener("click", async () => {
      if (!isValid() || isSubmitting) return;

      if (currentStepIndex < TOTAL_QUESTIONS) {
        currentStepIndex += 1;
        render();
      } else {
        // Always go to contact details form after last question
        currentStepIndex = CONTACT_STEP_INDEX;
        render();
      }
    });
  }

  function renderSingleChoice(q, container) {
    const existing = answers[q.id];
    const optionsWrapper = document.createElement("div");
    optionsWrapper.className = "options";

    q.options.forEach((label) => {
      const row = document.createElement("label");
      row.className = "option-row";

      const input = document.createElement("input");
      input.type = "radio";
      input.name = q.name || q.id;
      input.value = label;

      if (existing === label) {
        input.checked = true;
        row.classList.add("selected");
      }

      input.addEventListener("change", () => {
        answers[q.id] = label;
        saveAnswers();
        optionsWrapper
          .querySelectorAll(".option-row")
          .forEach((r) => r.classList.remove("selected"));
        row.classList.add("selected");
        container.closest(".screen")._updateNextBtnState();
      });

      const main = document.createElement("div");
      main.className = "option-main";
      const titleSpan = document.createElement("span");
      titleSpan.className = "option-label";
      titleSpan.textContent = label;
      main.appendChild(titleSpan);

      row.appendChild(input);
      row.appendChild(main);
      optionsWrapper.appendChild(row);
    });

    container.appendChild(optionsWrapper);
  }

  function renderMultiChoice(q, container) {
    const existing = Array.isArray(answers[q.id]) ? answers[q.id] : [];
    const optionsWrapper = document.createElement("div");
    optionsWrapper.className = "options";

    q.options.forEach((label) => {
      const row = document.createElement("label");
      row.className = "option-row";

      const input = document.createElement("input");
      input.type = "checkbox";
      input.name = (q.name || q.id) + "[]";
      input.value = label;

      if (existing.includes(label)) {
        input.checked = true;
        row.classList.add("selected");
      }

      input.addEventListener("change", () => {
        const set = new Set(Array.isArray(answers[q.id]) ? answers[q.id] : []);
        if (input.checked) {
          set.add(label);
        } else {
          set.delete(label);
        }
        answers[q.id] = Array.from(set);
        saveAnswers();

        if (input.checked) row.classList.add("selected");
        else row.classList.remove("selected");

        container.closest(".screen")._updateNextBtnState();
      });

      const main = document.createElement("div");
      main.className = "option-main";
      const titleSpan = document.createElement("span");
      titleSpan.className = "option-label";
      titleSpan.textContent = label;
      main.appendChild(titleSpan);

      row.appendChild(input);
      row.appendChild(main);
      optionsWrapper.appendChild(row);
    });

    const hint = document.createElement("div");
    hint.className = "small-hint";
    hint.textContent = "You can tick more than one box if several options fit.";

    container.appendChild(optionsWrapper);
    container.appendChild(hint);
  }

  function renderRating(q, container) {
    const existing = answers[q.id];
    const min = q.ratingMin ?? (q.type === "rating-0-10" ? 0 : 1);
    const max = q.ratingMax ?? (q.type === "rating-0-10" ? 10 : 5);

    const row = document.createElement("div");
    row.className = "rating-row";

    for (let i = min; i <= max; i++) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "rating-button";
      btn.textContent = String(i);
      if (existing === i) btn.classList.add("selected");

      btn.addEventListener("click", () => {
        answers[q.id] = i;
        saveAnswers();
        row.querySelectorAll(".rating-button").forEach((b) =>
          b.classList.remove("selected")
        );
        btn.classList.add("selected");

        let hiddenInput = container.querySelector(
          `input[type="hidden"][name="${q.name || q.id}"]`
        );
        if (!hiddenInput) {
          hiddenInput = document.createElement("input");
          hiddenInput.type = "hidden";
          hiddenInput.name = q.name || q.id;
          container.appendChild(hiddenInput);
        }
        hiddenInput.value = String(i);

        container.closest(".screen")._updateNextBtnState();
      });

      row.appendChild(btn);
    }

    container.appendChild(row);

    // Add labels and caption below the rating buttons
    const labels = document.createElement("div");
    labels.className = "rating-labels";

    if (q.type === "rating-0-10") {
      labels.innerHTML = `
        <span>${q.ratingLeft || "Very unlikely"}</span>
        <span>${q.ratingRight || "Very likely"}</span>
      `;
    } else {
      if (q.ratingLeft && q.ratingRight) {
        labels.innerHTML = `
          <span>${q.ratingLeft}</span>
          <span>${q.ratingRight}</span>
        `;
      }
    }

    const caption = document.createElement("div");
    caption.className = "rating-scale-caption";
    caption.textContent =
      q.type === "rating-0-10"
        ? "0 is the lowest score, 10 is the highest."
        : "1 is the lowest score, 5 is the highest.";

    if (q.ratingLeft && q.ratingRight) {
      container.appendChild(labels);
    }
    container.appendChild(caption);

    if (typeof existing === "number") {
      const hidden = document.createElement("input");
      hidden.type = "hidden";
      hidden.name = q.name || q.id;
      hidden.value = String(existing);
      container.appendChild(hidden);
    }
  }

  function renderText(q, container) {
    const existing = typeof answers[q.id] === "string" ? answers[q.id] : "";
    const textarea = document.createElement("textarea");
    textarea.name = q.name || q.id;
    if (q.placeholder) textarea.placeholder = q.placeholder;
    textarea.value = existing;

    textarea.addEventListener("input", () => {
      answers[q.id] = textarea.value;
      saveAnswers();
      container.closest(".screen")._updateNextBtnState();
    });

    container.appendChild(textarea);

    const hint = document.createElement("div");
    hint.className = "small-hint";
    hint.textContent =
      "Write as much or as little as you like – concrete examples are very helpful.";
    container.appendChild(hint);
  }

  formEl.addEventListener("submit", (e) => {
    e.preventDefault();
  });

  // Initial render
  render();
</script>
</body>
</html>
